<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockAI Intelligence</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c15;color:#eef3ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:220px;background:#0c111d;border-right:1px solid #20283a;padding:22px 12px;position:fixed;inset:0 auto 0 0}.logo{font-size:22px;font-weight:800;padding:4px 12px 25px}.logo i{color:#62a0ff;font-style:normal}.nav button{display:block;width:100%;padding:12px;border:0;border-radius:9px;background:transparent;color:#8995ad;text-align:left;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#182238;color:white}.main{margin-left:220px;padding:24px;max-width:1400px;width:100%}.top{display:flex;gap:12px}.search{flex:1;background:#101725;border:1px solid #273149;border-radius:11px;padding:12px 15px;color:white;outline:none}.btn{background:#17243b;border:1px solid #304667;color:#dce9ff;border-radius:9px;padding:10px 13px;cursor:pointer}.title{margin:25px 0 5px;font-size:27px}.muted{color:#8995ad}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.25fr .75fr}.card{background:#101725;border:1px solid #232d42;border-radius:14px;padding:16px}.label{font-size:11px;color:#7e8aa2;text-transform:uppercase;letter-spacing:.08em}.price{font-size:25px;font-weight:800;margin:5px 0}.up{color:#37d39b}.down{color:#ff687e}.yellow{color:#f3c85b}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section h2{font-size:16px;margin:0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #20283a}.row:last-child{border-bottom:0}.ticker{font-weight:800}.badge{font-size:11px;border-radius:6px;padding:4px 7px}.high{background:#461722;color:#ff9aaa}.med{background:#433713;color:#f6d475}.low{background:#12382f;color:#7ee5c2}.brief{line-height:1.65;color:#d8e1f2}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #2b3549;padding:6px 9px;border-radius:20px;color:#b8c4d9}.tabs{display:flex;gap:7px;margin:18px 0;overflow:auto}.tabs button{white-space:nowrap}.chart{height:250px;background:#0d1421;border-radius:10px;margin-top:15px;overflow:hidden}.chart svg{width:100%;height:100%}.score{font-size:42px;font-weight:900}.click{cursor:pointer}.click:hover{border-color:#42689d}.hidden{display:none}@media(max-width:850px){.side{display:none}.main{margin:0;padding:15px}.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}@media(max-width:500px){.g4,.g3{grid-template-columns:1fr}.title{font-size:23px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">Stock<i>AI</i></div><div class="nav">
<button class="active" data-page="home">◈ Overview</button>
<button data-page="anomaly">⚡ Anomaly Radar</button>
<button data-page="events">◷ Tonight / Events</button>
<button data-page="watch">★ AI Watchlist</button>
</div></aside>
<main class="main"><div class="top"><input id="search" class="search" placeholder="搜索股票，例如 NVDA / AAPL / TSLA"><button class="btn" onclick="alert('Prototype：这里以后连接真实数据 API')">⚙ Data</button></div><div id="view"></div></main></div>
<script>
const data={
NVDA:{name:'NVIDIA',p:'182.47',c:'+5.82%',score:87,why:['AI / data-center momentum','Semiconductor sector strength','Volume 2.4× recent average','News activity increased'],risk:['High short-term volatility','Valuation sensitivity','Upcoming catalysts']},
AAPL:{name:'Apple',p:'229.14',c:'+1.21%',score:73,why:['Mega-cap tech strength','Positive market breadth','Steady demand'],risk:['Macro sensitivity','Lower momentum']},
TSLA:{name:'Tesla',p:'314.08',c:'-4.18%',score:41,why:['Negative sentiment','High volatility','Event uncertainty'],risk:['Sharp reversals','Company-specific catalysts']}
};
let page='home',symbol='NVDA';
const q=s=>document.querySelector(s);
function nav(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.onclick=()=>{page=b.dataset.page;render()}})}
function event(t,level,text,cls){return `<div class="row"><div><b>${t}</b><div class="muted">${text}</div></div><span class="badge ${cls}">${level}</span></div>`}
function anomaly(t,c,l,d,cls){return `<div class="card click" onclick="openStock('${t}')"><div style="display:flex;justify-content:space-between"><b>${t}</b><span class="badge ${cls}">${l}</span></div><div class="${c[0]=='-'?'down':'up'} price">${c}</div><div class="muted">${d}</div></div>`}
function home(){return `<h1 class="title">Good evening.</h1><div class="muted">AI tells you what is happening, why it matters, and what to watch next.</div>
<div class="section"><h2>Market Overview</h2></div><div class="grid g4">
<div class="card"><div class="label">NASDAQ</div><div class="price">18,420</div><span class="up">+1.24%</span></div><div class="card"><div class="label">S&P 500</div><div class="price">6,302</div><span class="up">+0.81%</span></div><div class="card"><div class="label">Dow Jones</div><div class="price">43,781</div><span class="down">-0.12%</span></div><div class="card"><div class="label">VIX</div><div class="price">18.42</div><span class="yellow">+8.3%</span></div></div>
<div class="section"><h2>🧠 AI Market Brief</h2></div><div class="card brief">US equities are broadly firm. AI and semiconductor names are leading momentum, while volatility is rising into upcoming events. StockAI is prioritizing catalyst-driven moves instead of simply showing price changes.<div class="chips"><span class="chip">AI / Semiconductors ↑</span><span class="chip">Mega-cap Tech ↑</span><span class="chip">Volatility ↑</span><span class="chip">Events Ahead</span></div></div>
<div class="section"><h2>🚨 AI Anomaly Radar</h2><button class="btn" onclick="page='anomaly';render()">View all</button></div><div class="grid g3">${anomaly('NVDA','+5.82%','HIGH','4 unusual signals','high')}${anomaly('AMD','+4.27%','MEDIUM','Volume + options activity','med')}${anomaly('TSLA','-4.18%','HIGH','Sentiment + volatility','high')}</div>
<div class="section"><h2>🌙 Tonight / Upcoming Events</h2><button class="btn" onclick="page='events';render()">Calendar</button></div><div class="grid g2"><div class="card">${event('NVDA','HIGH','Company / earnings-related catalyst','high')}${event('FED','MEDIUM','Fed official speech','med')}${event('AAPL','MEDIUM','Product / company event','med')}</div><div class="card"><div class="label">AI Watchlist</div>${event('NVDA','87','Bullish momentum','high')}${event('AMD','81','Sector momentum','med')}${event('TSLA','41','Risk elevated','high')}</div></div>`}
function anomalyPage(){return `<h1 class="title">⚡ Anomaly Radar</h1><div class="muted">Find unusual activity before it becomes obvious.</div><div class="section"><h2>Detected signals</h2></div><div class="grid g3">${anomaly('NVDA','+5.82%','HIGH','Volume 2.4× + news spike','high')}${anomaly('AMD','+4.27%','MEDIUM','Options activity rising','med')}${anomaly('TSLA','-4.18%','HIGH','Volatility spike','high')}${anomaly('AVGO','+3.66%','MEDIUM','Sector momentum','med')}${anomaly('PLTR','+6.02%','HIGH','Price + volume divergence','high')}${anomaly('AAPL','+1.21%','LOW','No major anomaly','low')}</div>`}
function eventsPage(){return `<h1 class="title">🌙 Tonight / Upcoming Events</h1><div class="muted">Potential market-moving events.</div><div class="section"><h2>Today</h2></div><div class="card">${event('🔴 NVDA','HIGH','Company / earnings-related catalyst','high')}${event('🟠 FED','MEDIUM','Fed official speech','med')}${event('🟠 AAPL','MEDIUM','Company event','med')}${event('🟢 MACRO','LOW','Scheduled economic release','low')}</div>`}
function watchPage(){return `<h1 class="title">★ AI Watchlist</h1><div class="muted">Stocks StockAI thinks deserve attention.</div><div class="grid g2"><div class="card">${event('NVDA','87','AI momentum','high')}${event('AMD','81','Sector momentum','med')}${event('PLTR','79','Abnormal activity','high')}</div><div class="card"><div class="label">How StockAI selects</div><p class="brief">Momentum + news + volume + sector confirmation + event risk. These are research signals, not guaranteed predictions.</p></div></div>`}
function stockPage(){let s=data[symbol];return `<div class="tabs"><button class="btn">Overview</button><button class="btn" onclick="alert('AI 原因分析：\\n\\n'+s.why.join('\\n'))">Why Moving?</button><button class="btn" onclick="page='anomaly';render()">Anomalies</button><button class="btn" onclick="alert('News feed prototype：这里以后接 News API')">News</button><button class="btn" onclick="page='events';render()">Events</button></div>
<h1 class="title">${symbol} · ${s.name}</h1><div class="muted">AI Stock Intelligence</div><div class="grid g2"><div class="card"><div class="label">Price</div><div class="price">$${s.p}</div><span class="${s.c[0]=='-'?'down':'up'}">${s.c} today</span><div class="chart"><svg viewBox="0 0 700 250" preserveAspectRatio="none"><path d="M0 200 C90 175 130 195 190 150 S280 170 350 120 S440 140 500 90 S610 100 700 35" fill="none" stroke="#6ea8ff" stroke-width="4"/></svg></div></div><div class="card"><div class="label">AI Score</div><div class="score">${s.score}<small style="font-size:15px;color:#8995ad"> / 100</small></div><div class="${s.score>60?'up':'down'}">${s.score>60?'Bullish bias':'Risk elevated'}</div><div class="row"><span>Momentum</span><b>${Math.min(98,s.score+4)}</b></div><div class="row"><span>News</span><b>${s.score}</b></div><div class="row"><span>Risk</span><b>${100-s.score}</b></div></div></div>
<div class="section"><h2>🤖 AI Summary</h2></div><div class="card brief">${symbol} is currently showing a ${s.score>60?'positive':'risk-elevated'} setup. The system combines price, volume, news, sector and upcoming events to explain the move. Confirmed facts and AI interpretation should remain clearly separated.</div>
<div class="section"><h2>Why is it moving?</h2></div><div class="grid g2"><div class="card">${s.why.map(x=>event('✓','FACT',x,'low')).join('')}</div><div class="card">${s.risk.map(x=>event('!','RISK',x,'med')).join('')}</div></div>
<div class="section"><h2>🔮 What's Next?</h2></div><div class="card brief">Watch the next confirmed catalyst, volume persistence and sector follow-through. AI should present scenarios and risks rather than promise a certain future price.</div>`}
function openStock(s){symbol=s;page='stock';render()}
function render(){q('#view').innerHTML=page==='home'?home():page==='anomaly'?anomalyPage():page==='events'?eventsPage():page==='watch'?watchPage():stockPage();nav()}
q('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){let x=e.target.value.trim().toUpperCase();if(data[x])openStock(x);else alert('Prototype 可搜索：NVDA、AAPL、TSLA')}});render();
</script></body></html>
